; docker/php/uploads.ini
; ---------------------------------------------------------------------------
; Ajustes de PHP para permitir subir fotos de hasta 5 MB (CU-09, CU-17).
; Por defecto PHP solo acepta archivos de 2 MB, y ese valor NO se puede
; cambiar desde el código: hay que cambiarlo acá. El Dockerfile copia este
; archivo a la carpeta de configuración de PHP dentro del contenedor.
; ---------------------------------------------------------------------------
upload_max_filesize = 6M
post_max_size = 8M
file_uploads = On
