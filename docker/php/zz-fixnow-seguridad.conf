# docker/php/zz-fixnow-seguridad.conf
# ---------------------------------------------------------------------------
# Fase 8 - Ajustes de Apache para FixNow. El Dockerfile lo copia a
# /etc/apache2/conf-available/ y lo activa con "a2enconf".
# El nombre empieza con "zz" A PROPÓSITO: Apache carga los archivos en orden
# alfabético y el security.conf que trae Debian (que muestra la versión) se
# carga antes; así el nuestro es el último y gana.
# ---------------------------------------------------------------------------

# Apache no revela su versión ni el sistema operativo en las respuestas
# ni en las páginas de error.
ServerTokens Prod
ServerSignature Off

# Todo el sitio: sin listado de archivos de carpetas y sin archivos ocultos
# (los que empiezan con punto: .env, .git, .htaccess...).
<Directory "/var/www/html/public">
    Options -Indexes -ExecCGI
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</Directory>

# Carpeta de fotos subidas por los usuarios (perfiles y portfolio):
# aunque alguien lograra guardar un archivo .php ahí, Apache NUNCA lo ejecuta.
# Es una segunda barrera: la primera es que el servidor genera los nombres y
# las extensiones (ver src/helpers/Archivos.php).
<Directory "/var/www/html/public/assets/img">
    Options -Indexes -ExecCGI
    <FilesMatch "\.(php|phtml|phar|php[0-9]?|pht|cgi|pl|py)$">
        Require all denied
    </FilesMatch>
    <IfModule mod_php.c>
        php_admin_flag engine off
    </IfModule>
    <IfModule mod_php8.c>
        php_admin_flag engine off
    </IfModule>
</Directory>
