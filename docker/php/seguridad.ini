; docker/php/seguridad.ini
; ---------------------------------------------------------------------------
; Fase 8 - Ajustes de PHP "de producción" para el contenedor de FixNow.
; La imagen oficial php:8.2-apache NO trae un php.ini, así que PHP usa sus
; valores por defecto, que son pensados para desarrollar (muestran errores
; en pantalla). El Dockerfile copia este archivo a la carpeta de configuración
; de PHP dentro del contenedor.
; ---------------------------------------------------------------------------

; Los errores NO se muestran al visitante (podrían revelar rutas, consultas o
; datos internos). Se guardan en el log: "docker compose logs app".
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; PHP no anuncia su versión en las respuestas (cabecera X-Powered-By).
expose_php = Off

; Sesión: la cookie no es accesible desde JavaScript, solo viaja por cookie
; (nunca por la URL) y no se envía desde sitios ajenos. Seguridad::configurarSesion()
; repite estos valores desde el código, por si el .ini no se aplicara.
session.cookie_httponly = 1
session.use_only_cookies = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax

; Nadie puede hacer que PHP abra direcciones web como si fueran archivos.
allow_url_fopen = Off
allow_url_include = Off
